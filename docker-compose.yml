#       context: ./ai-gateway
#     container_name: FastAPI_AI_Gateway
#     ports:
#       - "8000:8000"
#     environment:
#       WORKER_URLS: ""
#     restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: React_Frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped
  # ==============================
  # MySQL (데이터베이스)
  # ==============================
  mysql-db:
    image: mysql:8.0
    container_name: Barmi_MySQL
    ports:
      - "3306:3306" # 로컬 DB 관리 툴(DBeaver 등)에서 접속 가능하게 노출
    env_file:
      - .env # .env 파일에서 비번 등 가져옴
    environment:
      TZ: Asia/Seoul # 시간대 한국으로 설정
    volumes:
      - ./db_data:/var/lib/mysql # DB 데이터를 내 폴더(db_data)에 저장 (컨테이너 꺼져도 데이터 유지)
    command: # 한글 깨짐 방지 설정
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    restart: always

  # ==============================
  # Backend (Spring Boot)
  # ==============================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: Spring_Backend
    ports:
      - "8080:8080" # 로컬호스트:8080으로 API 호출 가능
    env_file:
      - .env # DB 접속 정보 공유
    environment:
      # 로컬 도커 내부에서는 'localhost' 대신 서비스명('mysql-db')을 써야 함
      # .env에 있는 DB_URL을 덮어쓰거나, .env 자체를 수정해서 사용
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/barmi_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      # .env 파일의 값을 스프링 환경변수로 주입
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_VALIDITY_IN_SECONDS: ${JWT_ACCESS_EXP}
      JWT_REFRESH_TOKEN_VALIDITY_IN_SECONDS: ${JWT_REFRESH_EXP}
      TZ: Asia/Seoul
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # 마지막 한 줄 추가하니 되네요 ..
    depends_on:
      - mysql-db # DB가 먼저 켜져야 함
    restart: on-failure